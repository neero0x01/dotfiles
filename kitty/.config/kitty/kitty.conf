# vim: ft=kitty

# ─── Font ────────────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font Mono
bold_font        JetBrainsMono Nerd Font Mono Bold
italic_font      JetBrainsMono Nerd Font Mono Italic
bold_italic_font JetBrainsMono Nerd Font Mono Bold Italic
font_size        12.0
disable_ligatures never

# ─── Cursor ──────────────────────────────────────────────────────────────────
cursor_shape           beam
cursor_beam_thickness  1.8
cursor_blink_interval  0

# ─── Scrollback ──────────────────────────────────────────────────────────────
scrollback_lines 10000

# ─── Mouse ───────────────────────────────────────────────────────────────────
copy_on_select         clipboard
strip_trailing_spaces  smart
focus_follows_mouse    yes

# ─── Window ──────────────────────────────────────────────────────────────────
window_padding_width    10
placement_strategy      center
hide_window_decorations no
confirm_os_window_close 0
background_opacity      0.90
dynamic_background_opacity yes

# ─── Tab bar ─────────────────────────────────────────────────────────────────
tab_bar_edge              bottom
tab_bar_style             powerline
tab_powerline_style       slanted
tab_bar_min_tabs          1
tab_title_template        "{fmt.fg._cba6f7}{index}{fmt.fg.tab}: {title[:20]}"
active_tab_title_template "{fmt.fg._1e1e2e}{fmt.bg._cba6f7} {index}: {title[:20]} "

# ─── Layouts ─────────────────────────────────────────────────────────────────
enabled_layouts tall,stack,fat,grid,horizontal,vertical

# ─── Performance ─────────────────────────────────────────────────────────────
repaint_delay    8
input_delay      2
sync_to_monitor  yes

# ─── Bell ────────────────────────────────────────────────────────────────────
enable_audio_bell    no
visual_bell_duration 0.0

# ─── Keybindings ─────────────────────────────────────────────────────────────
# Splits (like Tilix)
map ctrl+shift+d  launch --location=vsplit --cwd=current
map ctrl+shift+e  launch --location=hsplit --cwd=current

# Navigate between splits
map ctrl+shift+h  neighboring_window left
map ctrl+shift+l  neighboring_window right
map ctrl+shift+k  neighboring_window up
map ctrl+shift+j  neighboring_window down

# Resize splits
map ctrl+shift+left  resize_window narrower 3
map ctrl+shift+right resize_window wider 3
map ctrl+shift+up    resize_window taller 3
map ctrl+shift+down  resize_window shorter 3

# Tabs
map ctrl+shift+t  new_tab_with_cwd
map ctrl+shift+w  close_tab
map ctrl+alt+1    goto_tab 1
map ctrl+alt+2    goto_tab 2
map ctrl+alt+3    goto_tab 3
map ctrl+alt+4    goto_tab 4
map ctrl+alt+5    goto_tab 5

# Cycle layouts
map ctrl+shift+space next_layout

# Zoom toggle (like Tilix maximize pane)
map ctrl+shift+z toggle_layout stack

# Font size
map ctrl+equal   change_font_size all +1.0
map ctrl+minus   change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0

# Scrollback in nvim/less
map ctrl+shift+h show_scrollback

# ─── Catppuccin Mocha ────────────────────────────────────────────────────────
include catppuccin-mocha.conf
