"$schema" = 'https://starship.rs/config-schema.json'

palette = "catppuccin_mocha"

# Two-line prompt: powerline left segments + right-aligned info + ❯ on line 2
format = """
[](mauve)\
[ $os](bg:mauve fg:base bold)\
[](fg:mauve bg:blue)\
[ $directory ](bg:blue fg:base bold)\
[](fg:blue bg:surface1)\
[$git_branch$git_status](bg:surface1 fg:text)\
[ ](bg:surface1)\
[](fg:surface1)\
$fill\
$cmd_duration\
$nodejs$python$java\
$docker_context$kubernetes\
[ $time ](fg:overlay1)\
\n$character"""

# ─── OS ──────────────────────────────────────────────────────────────────────
[os]
disabled = false
style = "bg:mauve fg:base bold"

[os.symbols]
Arch    = " "
Manjaro = " "
Linux   = " "
Macos   = " "
Windows = " "

# ─── Directory ───────────────────────────────────────────────────────────────
[directory]
style            = "bg:blue fg:base bold"
read_only        = " 󰌾"
truncation_length = 3
truncate_to_repo  = true
home_symbol       = "󰋜 ~"
format            = "[ $path$read_only ]($style)"

[directory.substitutions]
"Documents"  = "󰈙 "
"Downloads"  = " "
"Music"      = "󰝚 "
"Pictures"   = " "
"Developer"  = "󰲋 "
"projects"   = "󰲋 "
"dotfiles"   = " "

# ─── Git ─────────────────────────────────────────────────────────────────────
[git_branch]
symbol    = " "
style     = "bg:surface1 fg:mauve"
format    = "[ $symbol$branch(:$remote_branch)]($style)"

[git_status]
style      = "bg:surface1"
conflicted = "[⚡](fg:red bg:surface1)"
ahead      = "[⇡$count](fg:green bg:surface1)"
behind     = "[⇣$count](fg:yellow bg:surface1)"
diverged   = "[⇡$ahead_count⇣$behind_count](fg:red bg:surface1)"
untracked  = "[?](fg:overlay1 bg:surface1)"
stashed    = "[$](fg:overlay1 bg:surface1)"
modified   = "[!](fg:peach bg:surface1)"
staged     = "[+$count](fg:green bg:surface1)"
renamed    = "[»](fg:overlay1 bg:surface1)"
deleted    = "[✘](fg:red bg:surface1)"
format     = "[ $all_status$ahead_behind ]($style)"

# ─── Languages ───────────────────────────────────────────────────────────────
[nodejs]
symbol       = " "
style        = "fg:green"
format       = "[$symbol$version]($style) "
detect_files = ["package.json", ".nvmrc", ".node-version"]

[python]
symbol       = " "
style        = "fg:yellow"
format       = "[$symbol$version]($style) "
detect_files = [".python-version", "requirements.txt", "pyproject.toml", "Pipfile", "setup.py"]

[java]
symbol       = " "
style        = "fg:red"
format       = "[$symbol$version]($style) "
detect_files = ["pom.xml", "build.gradle", "build.gradle.kts", ".java-version"]

# ─── Containers / Cloud ───────────────────────────────────────────────────────
[docker_context]
symbol          = " "
style           = "fg:sapphire"
format          = "[$symbol$context]($style) "
only_with_files = true

[kubernetes]
disabled     = false
symbol       = "󱃾 "
style        = "fg:sky"
format       = "[$symbol$context(\\($namespace\\))]($style) "
detect_files = ["Helm*", "Chart*", "k8s", "*.yaml", "*.yml"]

# ─── Time & duration ─────────────────────────────────────────────────────────
[time]
disabled     = false
style        = "fg:overlay1"
format       = "[ 󱑊 $time]($style)"
time_format  = "%H:%M"

[cmd_duration]
min_time = 2_000
style    = "fg:yellow"
format   = "[󱎫 $duration]($style) "

# ─── Prompt character ────────────────────────────────────────────────────────
[character]
success_symbol  = "[❯](bold green)"
error_symbol    = "[❯](bold red)"
vimcmd_symbol   = "[❮](bold lavender)"

# ─── Catppuccin Mocha palette ────────────────────────────────────────────────
[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
red       = "#f38ba8"
maroon    = "#eba0ac"
peach     = "#fab387"
yellow    = "#f9e2af"
green     = "#a6e3a1"
teal      = "#94e2d5"
sky       = "#89dceb"
sapphire  = "#74c7ec"
blue      = "#89b4fa"
lavender  = "#b4befe"
text      = "#cdd6f4"
subtext1  = "#bac2de"
subtext0  = "#a6adc8"
overlay2  = "#9399b2"
overlay1  = "#7f849c"
overlay0  = "#6c7086"
surface2  = "#585b70"
surface1  = "#45475a"
surface0  = "#313244"
base      = "#1e1e2e"
mantle    = "#181825"
crust     = "#11111b"
